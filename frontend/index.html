<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSCC Treasure Hunt</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <h1>🏴‍☠️ CSCC Treasure Hunt</h1>

        <p class="subtitle">
            Solve. Search. Scan. Score.
        </p>

        <div class="game-card">

            <h2>Ready to hunt?</h2>

            <p>
                Solve challenges, follow clues,
                find hidden QR codes and collect points!
            </p>

            <input
                type="text"
                id="playerName"
                placeholder="Enter your nickname"
            >

            <button id="startButton">
                Start Hunt 🚀
            </button>

        </div>

    </main>

    <script src="script.js"></script>

</body>
</html>
